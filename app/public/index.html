<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>MapLine</title>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="map"></div>
<button id="headerButton" class="header-pill">
    <img id="headerAvatar" class="header-avatar" src="" alt="Profile photo">
    <span id="headerTitle" class="header-title">YOUR MAPLINE</span>
</button>
<button id="friendsButton" class="friends-button">FRIENDS</button>
<div id="viewingBanner" class="viewing-banner hidden">
    <span id="viewingBannerText"></span>
    <button id="backToMyMaplineButton">Back to My Mapline</button>
</div>
<div id="addMarkerPanel" class="add-marker-panel">
    <h1>Add Marker:</h1>
    <label for="yCoordinateInput">Y Coordinate:</label>
    <input id="yCoordinateInput" type="number" step="any">
    <label for="xCoordinateInput">X Coordinate:</label>
    <input id="xCoordinateInput" type="number" step="any">
    <label for="titleInput">Title:</label>
    <input id="titleInput" type="text">
    <label for="eventDateInput">Event Date:</label>
    <input id="eventDateInput" type="date">
    <button id="addMarkerButton" type="button">Add</button>
</div>
<div id="timelineRow" class="timeline-row">
    <span id="timelineStartLabel" class="timeline-label"></span>
    <input id="timelineSlider" class="timeline-slider" type="range" min="0" max="100" value="100">
    <span id="timelineEndLabel" class="timeline-label"></span>
</div>
<div id="editMarkerOverlay" class="modal-overlay hidden">
    <div class="modal-box">
        <button id="editMarkerCloseButton" class="modal-close"><i class="fa-solid fa-xmark"></i></button>
        <h1>EDIT MARKER</h1>
        <label for="editTitleInput">Title:</label>
        <input id="editTitleInput" type="text">
        <label for="editEventDateInput">Event Date:</label>
        <input id="editEventDateInput" type="date">
        <label for="editDescriptionInput">Description:</label>
        <textarea id="editDescriptionInput" placeholder="Type here..."></textarea>
        <label for="editImageInput">Insert Image:</label>
        <input id="editImageInput" type="file" accept="image/*">
        <img id="editImagePreview" class="image-preview hidden" src="" alt="Marker image preview">
        <button id="editMarkerDoneButton" type="button">DONE</button>
    </div>
</div>
<div id="editProfileOverlay" class="modal-overlay hidden">
    <div class="modal-box profile-modal">
        <button id="editProfileCloseButton" class="modal-close"><i class="fa-solid fa-xmark"></i></button>
        <h1>Edit Profile:</h1>
        <div class="profile-modal-body">
            <div class="profile-photo-column">
                <img id="editProfileAvatarPreview" class="profile-avatar-preview" src="" alt="Profile photo">
                <input id="editProfileAvatarInput" type="file" accept="image/*" class="hidden">
                <button id="changePhotoButton" type="button">Change profile photo</button>
            </div>
            <div class="profile-name-column">
                <input id="editProfileNameInput" type="text">
                <span class="field-caption">Change page name</span>
            </div>
        </div>
        <button id="editProfileDoneButton" type="button">DONE</button>
    </div>
</div>
<div id="friendsOverlay" class="modal-overlay hidden">
    <div class="modal-box">
        <button id="friendsCloseButton" class="modal-close"><i class="fa-solid fa-xmark"></i></button>
        <h1>FRIENDS</h1>
        <div id="friendsList" class="friends-list"></div>
        <div class="add-friend-row">
            <input id="addFriendInput" type="text" placeholder="Friend's name">
            <button id="addFriendButton" type="button">Add Friend</button>
        </div>
    </div>
</div>
<script src="map.js"></script>
<script src="profile.js"></script>
<script src="friends.js"></script>
</body>
</html>
